    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #fbfbfd;

    }

    /* ==================== MAP MODAL ==================== */
    #modalMap {

      border-radius: 1rem;
    }

    @media (min-width: 640px) {
      #modalMap {
        height: 380px;
      }

    /* ==================== SCROLLBAR ==================== */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ==================== ANIMATIONS ==================== */
    @keyframes radar-wave {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }
      70% {
        transform: scale(2.4);
        opacity: 0;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .radar-pulse {
      animation: radar-wave 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes live-glow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.45);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
      }
    }

    .live-glow {
      animation: live-glow 2.5s infinite;
    }

    /* Smooth vertical timeline travel for live dot */
    #liveTimeIndicator {
      transition: top 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;

  <!-- ==================== FIREBASE & LOGIC ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      addDoc,
      updateDoc,
      query,
      where,
      onSnapshot,
      serverTimestamp,
      getCountFromServer
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // ---- Firebase Config ----
    const firebaseConfig = {
      apiKey: "AIzaSyC5qI-YCwJK9Xj5Fci7vIArFMetj1ZP2_w",
      authDomain: "ceritaberdua-9f71d.firebaseapp.com",
      projectId: "ceritaberdua-9f71d",
      storageBucket: "ceritaberdua-9f71d.firebasestorage.app",
      messagingSenderId: "1044481677281",
      appId: "1:1044481677281:web:9f420eb6da603e99fa24a0",
      measurementId: "G-NR86918PVB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- Date & Time Formatters ----
    const IndonesianTime = {
      days: ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"],
      daysEn: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      months: [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ],
      monthsEn: [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ],
      getDateParts(date = new Date()) {
        const d = date instanceof Date ? date : new Date(date);
        const validDate = isNaN(d.getTime()) ? new Date() : d;
        const year = String(validDate.getFullYear());
        const month = String(validDate.getMonth() + 1).padStart(2, "0");
        const day = String(validDate.getDate()).padStart(2, "0");
        const hour = String(validDate.getHours()).padStart(2, "0");
        const minute = String(validDate.getMinutes()).padStart(2, "0");
        const dayOfWeek = validDate.getDay();
        return {
          year, month, day, hour, minute,
          dayIndex: dayOfWeek,
          dayName: this.days[dayOfWeek],
          dayEn: this.daysEn[dayOfWeek],
          monthName: this.months[validDate.getMonth()],
          monthNameEn: this.monthsEn[validDate.getMonth()]
        };
      },
      formatTime12(date) {
        if (!date) return { time: "--:--", ampm: "" };
        const d = date instanceof Date ? date : new Date(date);
        if (isNaN(d.getTime())) return { time: "--:--", ampm: "" };
        const rawHrs = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const hrs12 = rawHrs % 12 || 12;
        const ampm = rawHrs >= 12 ? 'PM' : 'AM';
        return { time: `${hrs12}:${mins}`, ampm };
      },
      formatTime24(date = new Date()) {
        const d = date instanceof Date ? date : new Date(date);
        const hrs = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${hrs}:${mins}`;
      },
      getLocalDateString(date = new Date()) {
        const p = this.getDateParts(date);
        return `${p.year}-${p.month}-${p.day}`;
      }
    };

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---- Group Code Detection ----
    function getGroupCode() {
      const urlParams = new URLSearchParams(window.location.search);
      let code = urlParams.get("group") || urlParams.get("code") || urlParams.get("pairCode");
      if (!code && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, "?"));
        code = hashParams.get("group") || hashParams.get("code") || hashParams.get("pairCode");
      }
      if (!code) {
        try {
          const profile = JSON.parse(localStorage.getItem("group_user_profile"));
          if (profile && profile.pairCode) {
            code = profile.pairCode;
          }
        } catch (e) {}
      }
      return code ? code.trim().toUpperCase() : null;
    }

    let groupCode = getGroupCode();

    // ---- App State ----
    let allAgendas = [];
    let selectedDateStr = IndonesianTime.getLocalDateString(); // default: today
    let weekOffset = 0; // 0 = current week, -1 = previous week, 1 = next week
    let isAllDatesMode = false;
    const openedCommentAgendaIds = new Set();
    const commentListeners = {};

    // Check group code overlay
    if (!groupCode) {
      document.getElementById("noGroupOverlay").classList.remove("hidden");
    } else {
      document.getElementById("publishGroupBadge").textContent = groupCode;
      initPublishRoom(groupCode);
    }

    document.getElementById("btnOpenDemoMode")?.addEventListener("click", () => {
      window.location.search = "?group=DEMO";
    });

    document.getElementById("groupInputForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("manualGroupInput").value.trim().toUpperCase();
      if (val) {
        window.location.search = `?group=${encodeURIComponent(val)}`;
      }
    });

    lucide.createIcons();

    // ==================== FIREBASE REALTIME LISTENER ====================
    function initPublishRoom(pairCode) {
      if (pairCode === "DEMO") {
        loadDemoAgendas();
        return;
      }

      const q = query(
        collection(db, "agendas"),
        where("pairCode", "==", pairCode)
      );

      onSnapshot(q, (snapshot) => {
        let agendas = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          agendas.push({ id: docSnap.id, ...data });
        });

        // Urutkan berdasarkan waktu mulai
        agendas.sort((a, b) => {
          const aTime = a.start ? new Date(a.start).getTime() : 0;
          const bTime = b.start ? new Date(b.start).getTime() : 0;
          return aTime - bTime;
        });

        allAgendas = agendas;

        // Update count badge
        document.getElementById("publishAgendaCount").textContent = `${allAgendas.length} Agenda`;

        renderWeekStrip();
        renderAgendas();
      }, (error) => {
        console.error("Gagal memuat agenda:", error);
        document.getElementById("agendaList").innerHTML = `
          <div class="text-center py-10 space-y-2 bg-white rounded-3xl p-6 border border-slate-100">
            <i data-lucide="alert-circle" class="h-8 w-8 text-rose-400 mx-auto"></i>
            <p class="text-sm text-rose-600 font-semibold">Gagal memuat data agenda</p>
            <p class="text-xs text-slate-400">${error.message}</p>
          </div>
        `;
        lucide.createIcons();
      });
    }

    function loadDemoAgendas() {
      const now = new Date();
      const ms20m = 20 * 60 * 1000;
      const ms40m = 40 * 60 * 1000;
      const activeStart = new Date(now.getTime() - ms20m);
      const activeEnd = new Date(now.getTime() + ms40m);

      const prevStart1 = new Date(now.getTime() - (2.5 * 60 * 60 * 1000));
      const prevEnd1 = new Date(now.getTime() - (1.8 * 60 * 60 * 1000));

      const prevStart2 = new Date(now.getTime() - (1.5 * 60 * 60 * 1000));
      const prevEnd2 = new Date(now.getTime() - (0.7 * 60 * 60 * 1000));

      const nextStart = new Date(now.getTime() + (1.2 * 60 * 60 * 1000));
      const nextEnd = new Date(now.getTime() + (2.0 * 60 * 60 * 1000));

      const fmtIso = (d) => {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      allAgendas = [
        {
          id: "demo-1",
          title: "Wakeup",
          desc: "Early wakeup from bed and fresh",
          start: fmtIso(prevStart1),
          end: fmtIso(prevEnd1),
          pairCode: "DEMO",
          createdByName: "Alex"
        },

    // ==================== WEEK STRIP (REFERENCE DESIGN: Mon 4, Tue 5 ... Sat 9) ====================
    function getWeekDays(referenceDate = new Date(), offsetWeeks = 0) {
      const curr = new Date(referenceDate);
      curr.setDate(curr.getDate() + (offsetWeeks * 7));
      
      // Hitung hari Senin dari minggu tersebut
      const day = curr.getDay();
      const diffToMonday = curr.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(curr.setDate(diffToMonday));

      const days = [];
      for (let i = 0; i < 7; i++) {
        const next = new Date(monday);
        next.setDate(monday.getDate() + i);
        days.push(next);
      }
      return days;
    }

    function renderWeekStrip() {
      const container = document.getElementById("weekDaysContainer");
      const weekLabel = document.getElementById("weekRangeLabel");
      if (!container) return;

      const todayStr = IndonesianTime.getLocalDateString();
      const weekDays = getWeekDays(new Date(), weekOffset);

      if (weekLabel) {
        if (weekOffset === 0) {
          weekLabel.textContent = "Minggu Ini";
        } else {
          const startP = IndonesianTime.getDateParts(weekDays[0]);
          const endP = IndonesianTime.getDateParts(weekDays[6]);
          weekLabel.textContent = `${startP.day} ${startP.monthName} — ${endP.day} ${endP.monthName}`;
        }
      }

      container.innerHTML = "";

      weekDays.forEach((d) => {
        const dateStr = IndonesianTime.getLocalDateString(d);
        const p = IndonesianTime.getDateParts(d);
        const isSelected = (!isAllDatesMode && selectedDateStr === dateStr);
        const isToday = (dateStr === todayStr);

        // Cari tahu apakah ada agenda di hari ini
        const hasEvents = allAgendas.some(a => {
          const aStart = a.start ? a.start.split('T')[0] : '';
          const aEnd = a.end ? a.end.split('T')[0] : aStart;
          return dateStr >= aStart && dateStr <= aEnd;
        });

        // Day Column Button Matching Reference UI:
        // Mon    Tue    Wed    Thu    Fri    Sat    Sun
        //  4      5      6      7      8      9     10
        //                                     •
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `flex flex-col items-center py-2 px-1 rounded-xl transition-all cursor-pointer select-none relative group ${
          isSelected 
            ? 'text-blue-600 font-bold'

        btn.innerHTML = `
          <span class="text-[11px] sm:text-xs tracking-tight ${isSelected ? 'text-blue-600 font-bold' : 'text-slate-400'}">

    // ==================== MOVING ANIMATED BLUE DOT CALCULATION ====================
    // "Dimana titik biru animasi berjalan sesuai waktu saat ini"
    function updateMovingBlueDot() {
      const indicatorEl = document.getElementById("liveTimeIndicator");
      const timeTextEl = document.getElementById("liveIndicatorTimeText");
      const clockBadgeText = document.getElementById("liveClockText");
      const containerEl = document.getElementById("timelineContainer");

      if (!indicatorEl || !containerEl) return;

      const now = new Date();
      const timeStr = IndonesianTime.formatTime24(now);
      if (timeTextEl) timeTextEl.textContent = timeStr;
      if (clockBadgeText) clockBadgeText.textContent = timeStr;

      const todayStr = IndonesianTime.getLocalDateString();

      // Hanya tampilkan titik animasi jika melihat jadwal HARI INI (atau mode semua tanggal yang mencakup hari ini)
      if (!isAllDatesMode && selectedDateStr !== todayStr) {
        indicatorEl.classList.add("hidden");
        return;
      }

      const rows = Array.from(document.querySelectorAll(".agenda-timeline-row"));
      if (rows.length === 0) {
        indicatorEl.classList.add("hidden");
        return;
      }

      indicatorEl.classList.remove("hidden");

      const nowMs = now.getTime();
      const containerRect = containerEl.getBoundingClientRect();

      // Cari posisi vertikal node berdasarkan waktu saat ini
      // Kumpulkan semua titik referensi waktu dari agenda yang ada di layar
      const timePoints = [];
      rows.forEach(r => {
        const nodeEl = r.querySelector(".timeline-node");
        if (!nodeEl) return;
        const nodeRect = nodeEl.getBoundingClientRect();
        const topY = (nodeRect.top + (nodeRect.height / 2)) - containerRect.top;

        const startMs = Number(r.dataset.startMs) || 0;
        const endMs = Number(r.dataset.endMs) || 0;

        if (startMs) {
          timePoints.push({ timeMs: startMs, topY, row: r });
        }
      });

      let targetTopY = 30; // default

      if (timePoints.length === 1) {
        const pt = timePoints[0];
        if (nowMs < pt.timeMs) {
          targetTopY = Math.max(16, pt.topY - 24);
        } else {
          targetTopY = pt.topY + 12;
        }
      } else if (timePoints.length > 1) {
        // Cek apakah waktu saat ini berada sebelum agenda pertama
        if (nowMs <= timePoints[0].timeMs) {
          targetTopY = Math.max(16, timePoints[0].topY - 20);
        } 
        // Cek apakah waktu saat ini berada setelah agenda terakhir
        else if (nowMs >= timePoints[timePoints.length - 1].timeMs) {
          targetTopY = timePoints[timePoints.length - 1].topY + 28;
        } 
        // Waktu saat ini berada di antara dua agenda
        else {
          for (let i = 0; i < timePoints.length - 1; i++) {
            const ptA = timePoints[i];
            const ptB = timePoints[i + 1];
            if (nowMs >= ptA.timeMs && nowMs <= ptB.timeMs) {
              const fraction = (nowMs - ptA.timeMs) / (ptB.timeMs - ptA.timeMs);
              targetTopY = ptA.topY + (fraction * (ptB.topY - ptA.topY));
              break;
            }
          }
        }
      }

      indicatorEl.style.top = `${Math.round(targetTopY)}px`;
    }

    // Timer interval setiap 10 detik untuk memperbarui posisi titik biru & status aktif kartu
    setInterval(() => {
      updateMovingBlueDot();

      // Cek apakah ada agenda yang baru masuk jam aktif
      const nowMs = Date.now();
      let statusChanged = false;
      document.querySelectorAll(".agenda-timeline-row").forEach(r => {
        const startMs = Number(r.dataset.startMs) || 0;
        const endMs = Number(r.dataset.endMs) || 0;
        const wasActive = r.dataset.isActive === "true";
        const isNowActive = Boolean(startMs && endMs && nowMs >= startMs && nowMs <= endMs);
        if (wasActive !== isNowActive) {
          statusChanged = true;
        }
      });

      if (statusChanged) {
        renderAgendas();
      }
    }, 10000);

    // Update posisi saat window resize
    window.addEventListener("resize", () => {
      updateMovingBlueDot();
    });

    // ==================== EVENT LISTENERS (MAPS, COMMENTS) ====================
    function attachEventListeners() {
      const listEl = document.getElementById("agendaList");
      if (!listEl) return;

      // Peta
      listEl.querySelectorAll(".btn-open-map").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const lat = parseFloat(btn.dataset.lat);
          const lng = parseFloat(btn.dataset.lng);
          const title = btn.dataset.title;
          const locName = btn.dataset.locname;
          const locAddress = btn.dataset.locaddress;
          if (!isNaN(lat) && !isNaN(lng)) {
            openMapModal({ lat, lng, title, locName, locAddress });
          }
        });
      });


      // Toggle Komentar
      listEl.querySelectorAll(".btn-toggle-comments").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const agendaId = btn.dataset.agendaId;
          const section = document.getElementById(`comments-${agendaId}`);
          if (!section) return;

          const isOpen = section.classList.contains("open");
          if (!isOpen) {
            section.classList.add("open");
            openedCommentAgendaIds.add(agendaId);
            startCommentListener(agendaId);
          } else {
            section.classList.remove("open");
            openedCommentAgendaIds.delete(agendaId);
            stopCommentListener(agendaId);
          }
          // Recalculate timeline indicator after drawer expands
          setTimeout(updateMovingBlueDot, 200);
        });
      });

      // Submit Komentar
      listEl.querySelectorAll(".comment-form").forEach(form => {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const agendaId = form.dataset.agendaId;
          const input = form.querySelector("input");
          const text = input.value.trim();
          if (!text || !agendaId) return;

          input.value = "";
          input.disabled = true;

          const nowMs = Date.now();
          try {
            await addDoc(collection(db, "agendas", agendaId, "chats"), {
              senderId: "anonymous",
              senderName: "",
              senderGender: "unknown",
              isAnonymous: true,
              text,
              localCreatedAt: nowMs,
              timestamp: serverTimestamp()
            });

            await updateDoc(doc(db, "agendas", agendaId), {
              lastChatTime: nowMs,
              lastChatSenderId: "anonymous",
              lastChatSenderName: "",
              lastChatText: text
            });
          } catch (err) {
            console.error("Gagal mengirim komentar:", err);
            alert("Gagal mengirim komentar: " + err.message);
          } finally {
            input.disabled = false;
            input.focus();
          }
        });
      });

      // Fetch Comment Counts
      listEl.querySelectorAll(".comment-count-badge[data-count-for]").forEach(badge => {
        const agendaId = badge.dataset.countFor;
        if (!agendaId) return;
        getCountFromServer(collection(db, "agendas", agendaId, "chats"))
          .then(snapshot => {
            badge.textContent = String(snapshot.data().count);
          })
          .catch(() => {});
      });

      // Re-attach comment listeners yang sedang terbuka
      openedCommentAgendaIds.forEach(agendaId => {
        stopCommentListener(agendaId);
        startCommentListener(agendaId);
      });
    }

    // ==================== REALTIME CHAT LISTENERS ====================
    function startCommentListener(agendaId) {
      if (commentListeners[agendaId]) return;

      const chatsRef = collection(db, "agendas", agendaId, "chats");
      commentListeners[agendaId] = onSnapshot(chatsRef, (snapshot) => {
        const listEl = document.getElementById(`commentList-${agendaId}`);
        const countBadge = document.querySelector(`[data-count-for="${agendaId}"]`);
        if (!listEl) return;

        if (snapshot.empty) {
          listEl.innerHTML = `<p class="text-[11px] opacity-70 text-center py-2">Belum ada komentar.</p>`;
          if (countBadge) countBadge.textContent = "0";
          return;
        }

        const msgs = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          let timeVal = 0;
          if (data.timestamp?.toMillis) timeVal = data.timestamp.toMillis();
          else if (data.localCreatedAt) timeVal = data.localCreatedAt;
          else timeVal = Date.now();
          msgs.push({ id: docSnap.id, ...data, _sortTime: timeVal });
        });

        msgs.sort((a, b) => a._sortTime - b._sortTime);
        if (countBadge) countBadge.textContent = String(msgs.length);

        listEl.innerHTML = "";
        msgs.forEach(msg => {
          const isAnon = msg.isAnonymous === true;
          let time = "";
          if (msg.timestamp?.toDate) {
            time = IndonesianTime.formatTime24(msg.timestamp.toDate());
          } else if (typeof msg.localCreatedAt === "number") {
            time = IndonesianTime.formatTime24(new Date(msg.localCreatedAt));
          }

          const el = document.createElement("div");
          el.className = "rounded-xl p-2 bg-black/10 backdrop-blur-xs text-xs space-y-0.5";
          el.innerHTML = `
            <div class="flex items-center justify-between text-[10px] opacity-75">
              <span>${isAnon ? 'Anonim' : escapeHtml(msg.senderName || 'Member')}</span>
              <span>${time}</span>
            </div>
            <p class="leading-relaxed break-words">${escapeHtml(msg.text)}</p>
          `;
          listEl.appendChild(el);
        });
      });
    }

    function stopCommentListener(agendaId) {
      if (commentListeners[agendaId]) {
        commentListeners[agendaId]();
        delete commentListeners[agendaId];
      }
    }

    // ==================== MAP MODAL ====================
    let modalMap = null;
    let modalMarker = null;

    function openMapModal({ lat, lng, title, locName, locAddress }) {
      const modal = document.getElementById("mapModal");
      const titleEl = document.getElementById("modalAgendaTitle");
      const nameEl = document.getElementById("modalLocationName");
      const addressEl = document.getElementById("modalLocationAddress");
      const coordsEl = document.getElementById("modalCoordinatesText");
      const btnRoute = document.getElementById("btnGoogleMapsRoute");
      const btnSearch = document.getElementById("btnGoogleMapsSearch");

      titleEl.textContent = title || "Agenda";
      nameEl.textContent = locName || "Lokasi Kegiatan";
      
      if (locAddress && locAddress !== locName) {
        addressEl.textContent = locAddress;
        addressEl.classList.remove("hidden");
      } else {
        addressEl.classList.add("hidden");
      }

      coordsEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      btnRoute.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
      btnSearch.href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";

      if (!modalMap) {
        modalMap = L.map("modalMap", {
          zoomControl: true,
          scrollWheelZoom: true,
          attributionControl: false
        }).setView([lat, lng], 16);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19
        }).addTo(modalMap);
      } else {
        modalMap.setView([lat, lng], 16);
      }

      const pinIcon = L.divIcon({
        className: 'custom-pin',
        html: `
          <div class="relative flex items-center justify-center cursor-pointer">
            <div class="h-9 w-9 rounded-full bg-blue-600 ring-4 ring-blue-200 text-white flex items-center justify-center shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
            </div>
            <div class="absolute -bottom-1 h-2.5 w-2.5 rotate-45 bg-blue-600"></div>
          </div>
        `,
        iconSize: [36, 40],
        iconAnchor: [18, 40]
      });

      if (modalMarker) modalMap.removeLayer(modalMarker);
      modalMarker = L.marker([lat, lng], { icon: pinIcon }).addTo(modalMap);

      setTimeout(() => {
        if (modalMap) {
          modalMap.invalidateSize();
          modalMap.panTo([lat, lng]);
        }
      }, 200);
    }

    function closeMapModal() {
      document.getElementById("mapModal").classList.add("hidden");
      document.body.style.overflow = "";
    }

    document.getElementById("btnCloseMapModal").addEventListener("click", closeMapModal);
    document.getElementById("mapModal").addEventListener("click", (e) => {
      if (e.target.id === "mapModal") closeMapModal();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeMapModal();
      }
    });

  </script>
</body>
